
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aplikasi Ujian - SMP Negeri 4 Tanggul</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #243f62;
      background: linear-gradient(
        to top,
        #eaf2fc 0%,
        #f4f7fc 50%,
        #ffffff 100%
      );
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      background: #fff;
      border: 1px solid #dfe7f0;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(36, 63, 98, .08);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #315f9f, #78a7db);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    p {
      color: #718096;
      font-size: 14px;
      line-height: 1.7;
    }

    .status {
      margin: 20px 0;
      padding: 12px;
      border-radius: 8px;
      background: #f1f6fd;
      font-size: 13px;
      line-height: 1.6;
    }

    .links {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .links a {
      display: block;
      padding: 12px;
      border: 1px solid #d8e4f3;
      border-radius: 8px;
      color: #315f9f;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .links a:hover {
      background: #f1f6fd;
    }

    .note {
      margin-top: 18px;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Aplikasi Ujian</h1>
    <p>SMP Negeri 4 Tanggul</p>

    <div class="status" id="status">
      Menyiapkan aplikasi untuk perangkat Anda...
    </div>

    <div class="links">
      <a id="linkPC" href="#">
        Buka Aplikasi melalui Komputer
      </a>

      <a id="linkHP" href="#">
        Buka Aplikasi melalui HP
      </a>
    </div>

    <p class="note">
      Jika aplikasi tidak terbuka otomatis, pilih tautan
      yang sesuai dengan perangkat Anda.
    </p>
  </main>


<script>
  // Link deployment asli.
  const linkPC =
    "https://script.google.com/macros/s/AKfycbzODZAVFwwYZKF5MVlZf8u7bJjWzIpOuQdlJhgeICLiINE5bMIl37w6C0elBcWGAXeQ/exec";

  // Link alternatif dengan /a/*/.
  const linkHP =
    "https://script.google.com/a/*/macros/s/AKfycbzODZAVFwwYZKF5MVlZf8u7bJjWzIpOuQdlJhgeICLiINE5bMIl37w6C0elBcWGAXeQ/exec";

  const KUNCI_PILIHAN = "ujian_link_preferensi_v1";
  const KUNCI_COBA = "ujian_redirect_auto_coba_v3";

  const ua = navigator.userAgent || "";

  const perangkatHP =
    /Android|iPhone|iPad|iPod|Mobile|Windows Phone|Opera Mini|IEMobile/i
      .test(ua) ||
    (
      (navigator.maxTouchPoints || 0) > 0 &&
      window.matchMedia("(pointer: coarse)").matches &&
      Math.min(
        window.screen.width || window.innerWidth,
        window.innerWidth || window.screen.width
      ) <= 1200
    );

  const browserNonChrome =
    /SamsungBrowser|MiuiBrowser|HuaweiBrowser|HeyTapBrowser|VivoBrowser|EdgA|EdgiOS|OPR\/|Opera|Firefox|FxiOS|UCBrowser|YaBrowser|DuckDuckGo|Brave|Vivaldi|MicroMessenger|FBAN|FBAV|Instagram|;\s*wv\)/i
      .test(ua);

  const browserChrome =
    /Chrome\/\d+|CriOS\/\d+/i.test(ua) &&
    !browserNonChrome;

  const status = document.getElementById("status");
  const tombolPC = document.getElementById("linkPC");
  const tombolHP = document.getElementById("linkHP");
  const tombolChrome = document.getElementById("linkChrome");

  if (!status || !tombolPC || !tombolHP) {
    console.error("Elemen halaman pengarah tidak ditemukan.");
  } else {

    tombolPC.href = linkPC;
    tombolHP.href = linkHP;

    tombolPC.textContent = "Coba Link Asli";
    tombolHP.textContent = "Coba Link Alternatif";

    tombolPC.style.display = "block";
    tombolHP.style.display = "block";

    if (tombolChrome) {
      tombolChrome.style.display = "none";
    }

    // Jika pengguna memilih link secara manual,
    // simpan pilihannya untuk kunjungan berikutnya.
    tombolPC.addEventListener("click", function() {
      try {
        localStorage.setItem(KUNCI_PILIHAN, "asli");
      } catch (error) {
        console.warn("Pilihan link tidak dapat disimpan.");
      }
    });

    tombolHP.addEventListener("click", function() {
      try {
        localStorage.setItem(KUNCI_PILIHAN, "alternatif");
      } catch (error) {
        console.warn("Pilihan link tidak dapat disimpan.");
      }
    });

    let pilihanTersimpan = "";

    try {
      pilihanTersimpan =
        localStorage.getItem(KUNCI_PILIHAN) || "";
    } catch (error) {
      console.warn("Preferensi link tidak dapat dibaca.");
    }

    let baruDicoba = false;

    // Hindari pengalihan berulang setelah kegagalan
    // pada tab yang sama.
    try {
      const waktuTerakhir = Number(
        sessionStorage.getItem(KUNCI_COBA) || 0
      );

      baruDicoba =
        waktuTerakhir > 0 &&
        Date.now() - waktuTerakhir < 30000;

    } catch (error) {
      console.warn("Status pengalihan tidak dapat dibaca.");
    }

    if (baruDicoba) {

      status.textContent =
        "Pengalihan otomatis baru saja dicoba. " +
        "Jika aplikasi tidak terbuka, gunakan salah satu tautan di bawah.";

    } else {

      let tujuan;
      let alasan;

      if (pilihanTersimpan === "asli") {

        tujuan = linkPC;
        alasan = "menggunakan pilihan link asli yang tersimpan";

      } else if (pilihanTersimpan === "alternatif") {

        tujuan = linkHP;
        alasan = "menggunakan pilihan link alternatif yang tersimpan";

      } else if (perangkatHP && browserChrome) {

        tujuan = linkHP;
        alasan = "mencoba link alternatif berdasarkan deteksi browser";

      } else {

        tujuan = linkPC;
        alasan = "mencoba link asli berdasarkan deteksi perangkat";

      }

      status.textContent =
        "Mencoba membuka aplikasi otomatis (" + alasan + "). " +
        "Jika tidak berhasil, kembali ke halaman ini dan pilih tautan lainnya.";

      try {
        sessionStorage.setItem(KUNCI_COBA, String(Date.now()));
      } catch (error) {
        // Pengalihan tetap dapat dilakukan tanpa sessionStorage.
      }

      window.setTimeout(function() {
        window.location.href = tujuan;
      }, 1500);
    }
  }
</script>

  
</body>
</html>
