
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aplikasi Ujian - SMP Negeri 4 Tanggul</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #243f62;
      background: linear-gradient(
        to top,
        #eaf2fc 0%,
        #f4f7fc 50%,
        #ffffff 100%
      );
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      background: #fff;
      border: 1px solid #dfe7f0;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(36, 63, 98, .08);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #315f9f, #78a7db);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    p {
      color: #718096;
      font-size: 14px;
      line-height: 1.7;
    }

    .status {
      margin: 20px 0;
      padding: 12px;
      border-radius: 8px;
      background: #f1f6fd;
      font-size: 13px;
      line-height: 1.6;
    }

    .links {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .links a {
      display: block;
      padding: 12px;
      border: 1px solid #d8e4f3;
      border-radius: 8px;
      color: #315f9f;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    .links a:hover {
      background: #f1f6fd;
    }

    .note {
      margin-top: 18px;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Aplikasi Ujian</h1>
    <p>SMP Negeri 4 Tanggul</p>

    <div class="status" id="status">
      Menyiapkan aplikasi untuk perangkat Anda...
    </div>

    <div class="links">
      <a id="linkPC" href="#">
        Buka Aplikasi melalui Komputer
      </a>

      <a id="linkHP" href="#">
        Buka Aplikasi melalui HP
      </a>
    </div>

    <p class="note">
      Jika aplikasi tidak terbuka otomatis, pilih tautan
      yang sesuai dengan perangkat Anda.
    </p>
  </main>

<script>
  // Link deployment asli.
  const linkPC =
    "https://script.google.com/macros/s/AKfycbzODZAVFwwYZKF5MVlZf8u7bJjWzIpOuQdlJhgeICLiINE5bMIl37w6C0elBcWGAXeQ/exec";

  // Link alternatif yang sudah Anda uji pada HP.
  const linkHP =
    "https://script.google.com/a/*/macros/s/AKfycbzODZAVFwwYZKF5MVlZf8u7bJjWzIpOuQdlJhgeICLiINE5bMIl37w6C0elBcWGAXeQ/exec";

  const ua = navigator.userAgent || "";

  const terdeteksiHP =
    /Android|iPhone|iPad|iPod|Mobile|Windows Phone|Opera Mini|IEMobile/i
      .test(ua);

  const layarSentuh =
    (navigator.maxTouchPoints || 0) > 0 ||
    window.matchMedia("(pointer: coarse)").matches;

  const lebarLayar = Math.min(
    window.screen.width || window.innerWidth,
    window.innerWidth || window.screen.width
  );

  // Jika browser HP menggunakan identitas desktop,
  // layar sentuh yang relatif kecil tetap ditawarkan pilihan.
  const perangkatHP =
    terdeteksiHP || (layarSentuh && lebarLayar <= 1200);

  const status = document.getElementById("status");
  const tombolPC = document.getElementById("linkPC");
  const tombolHP = document.getElementById("linkHP");

  const tombolChrome = document.getElementById("linkChrome");

  tombolPC.href = linkPC;
  tombolHP.href = linkHP;

  // Tombol khusus Chrome tidak lagi diperlukan.
  if (tombolChrome) {
    tombolChrome.style.display = "none";
  }

  if (perangkatHP) {

    // Jangan mengalihkan HP secara otomatis.
    // Pengguna memilih link yang cocok dengan browsernya.
    status.textContent =
      "Pilih salah satu tautan untuk membuka Aplikasi Ujian. " +
      "Jika satu tautan tidak berhasil, kembali ke halaman ini " +
      "dan coba pilihan lainnya.";

    tombolPC.style.display = "block";
    tombolPC.textContent =
      "Coba Link Asli";

    tombolHP.style.display = "block";
    tombolHP.textContent =
      "Coba Link Alternatif untuk HP";

  } else {

    // Komputer tetap otomatis memakai link asli.
    status.textContent =
      "Perangkat komputer terdeteksi. Membuka Aplikasi Ujian...";

    tombolPC.style.display = "none";
    tombolHP.style.display = "none";

    window.setTimeout(function() {
      window.location.replace(linkPC);
    }, 1200);

  }
</script>

  
</body>
</html>
